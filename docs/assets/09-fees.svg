<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="limeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c48b96" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c48b96" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="420" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="417" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="412" width="1100" height="4" fill="url(#limeline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g stroke="#c48b96" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5"/>
  </g>
  <circle cx="111" cy="10" r="1.6" fill="#c48b96"/>
  <circle cx="106.8" cy="22" r="1.7" fill="#c48b96"/>
  <circle cx="115.2" cy="22" r="1.7" fill="#c48b96"/>
  <path d="M107 27 Q111 30 115 27" stroke="#c48b96" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">marketplace economics — a fee on sales, not a publisher tax</text>

  <!-- fee cards -->
  <g font-size="12">
    <rect x="40" y="72" width="331" height="150" rx="10" fill="#161b22" stroke="#c48b96" stroke-width="2"/>
    <text x="62" y="100" fill="#c48b96" font-weight="bold" font-size="14">iNFT AGENTS</text>
    <text x="62" y="148" fill="#e3b7bf" font-weight="bold" font-size="34">5%</text>
    <text x="62" y="178" fill="#c9d1d9">on every sale, forever</text>
    <text x="62" y="198" fill="#566070" font-size="11">embedded in the contract (ERC-2981)</text>

    <rect x="384" y="72" width="331" height="150" rx="10" fill="#161b22" stroke="#b39ddb" stroke-width="2"/>
    <text x="406" y="100" fill="#b39ddb" font-weight="bold" font-size="14">SKILLS</text>
    <text x="406" y="148" fill="#b39ddb" font-weight="bold" font-size="34">1%</text>
    <text x="406" y="178" fill="#c9d1d9">only on the first sale</text>
    <text x="406" y="198" fill="#566070" font-size="11">resales are fee-free</text>

    <rect x="728" y="72" width="331" height="150" rx="10" fill="#161b22" stroke="#5ed3d8" stroke-width="2"/>
    <text x="750" y="100" fill="#5ed3d8" font-weight="bold" font-size="14">TOOLS</text>
    <text x="750" y="148" fill="#5ed3d8" font-weight="bold" font-size="34">free</text>
    <text x="750" y="178" fill="#c9d1d9">free to use for everyone</text>
    <text x="750" y="198" fill="#566070" font-size="11">5% only if minted as an iNFT</text>
  </g>

  <!-- rails -->
  <g font-size="12">
    <rect x="40" y="258" width="510" height="88" rx="10" fill="#161b22" stroke="#6ea8ff" stroke-width="2"/>
    <text x="62" y="288" fill="#6ea8ff" font-weight="bold" font-size="14">ETH / USDC on Base</text>
    <text x="62" y="314" fill="#8b949e">agents mint &amp; trade here — deep liquidity</text>

    <rect x="570" y="258" width="490" height="88" rx="10" fill="#161b22" stroke="#f0a14a" stroke-width="2"/>
    <text x="592" y="288" fill="#f0a14a" font-weight="bold" font-size="14">$ICLONE</text>
    <text x="592" y="314" fill="#8b949e">skills &amp; services — prices fixed in USD, quantity adjusts</text>
  </g>

  <text x="550" y="384" text-anchor="middle" fill="#8b949e" font-size="13">you only pay when something sells</text>
</svg>
