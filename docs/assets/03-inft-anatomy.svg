<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="limeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c48b96" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c48b96" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="500" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="497" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="492" width="1100" height="4" fill="url(#limeline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g stroke="#c48b96" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5"/>
  </g>
  <circle cx="111" cy="10" r="1.6" fill="#c48b96"/>
  <circle cx="106.8" cy="22" r="1.7" fill="#c48b96"/>
  <circle cx="115.2" cy="22" r="1.7" fill="#c48b96"/>
  <path d="M107 27 Q111 30 115 27" stroke="#c48b96" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">anatomy of an iNFT — four parts, one non-fungible key</text>

  <!-- connectors -->
  <g stroke="#566070" stroke-width="2">
    <line x1="340" y1="120" x2="445" y2="200"/>
    <line x1="760" y1="120" x2="655" y2="200"/>
    <line x1="340" y1="382" x2="445" y2="300"/>
    <line x1="760" y1="382" x2="655" y2="300"/>
  </g>
  <g fill="#566070">
    <circle cx="340" cy="120" r="3.5"/><circle cx="760" cy="120" r="3.5"/>
    <circle cx="340" cy="382" r="3.5"/><circle cx="760" cy="382" r="3.5"/>
  </g>

  <!-- corner parts -->
  <g font-size="12">
    <rect x="40" y="70" width="300" height="96" rx="10" fill="#161b22" stroke="#c48b96" stroke-width="2"/>
    <text x="60" y="98" fill="#c48b96" font-weight="bold">AI AGENT</text>
    <text x="60" y="122" fill="#c9d1d9">Pi coding agent runtime</text>
    <text x="60" y="142" fill="#566070" font-size="11">works · learns · earns</text>

    <rect x="760" y="70" width="300" height="96" rx="10" fill="#161b22" stroke="#6ea8ff" stroke-width="2"/>
    <text x="780" y="98" fill="#6ea8ff" font-weight="bold">NFT IDENTITY</text>
    <text x="780" y="122" fill="#c9d1d9">ERC-721 on Base Mainnet</text>
    <text x="780" y="142" fill="#566070" font-size="11">image stored fully on-chain</text>

    <rect x="40" y="334" width="300" height="96" rx="10" fill="#161b22" stroke="#b39ddb" stroke-width="2"/>
    <text x="60" y="362" fill="#b39ddb" font-weight="bold">NEURAL SOUL</text>
    <text x="60" y="386" fill="#c9d1d9">neural_soul.md — base character</text>
    <text x="60" y="406" fill="#566070" font-size="11">sealed on Irys / Arweave</text>

    <rect x="760" y="334" width="300" height="96" rx="10" fill="#161b22" stroke="#f0a14a" stroke-width="2"/>
    <text x="780" y="362" fill="#f0a14a" font-weight="bold">TOKEN-BOUND WALLET</text>
    <text x="780" y="386" fill="#c9d1d9">ERC-6551 account</text>
    <text x="780" y="406" fill="#566070" font-size="11">earnings travel with the token</text>
  </g>

  <!-- center -->
  <rect x="400" y="195" width="300" height="110" rx="10" fill="#161b22" stroke="#c48b96" stroke-width="2.5"/>
  <text x="550" y="230" text-anchor="middle" fill="#c48b96" font-weight="bold" font-size="18">iNFT</text>
  <text x="550" y="254" text-anchor="middle" fill="#c9d1d9" font-size="12">agent + NFT fused into one token</text>
  <text x="550" y="276" text-anchor="middle" fill="#566070" font-size="11">whoever holds it, holds the agent</text>

  <text x="550" y="470" text-anchor="middle" fill="#8b949e" font-size="13">transfer the token → the identity, the earnings, the configuration all move with it</text>
</svg>
