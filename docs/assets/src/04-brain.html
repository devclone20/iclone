<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}svg{display:block}</style></head><body>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b0d14"/><stop offset="100%" stop-color="#06070b"/></linearGradient>
    <radialGradient id="rF" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#9fe016" stop-opacity="0.85"/><stop offset="100%" stop-color="#9fe016" stop-opacity="0"/></radialGradient>
    <radialGradient id="rP" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#5ed3d8" stop-opacity="0.85"/><stop offset="100%" stop-color="#5ed3d8" stop-opacity="0"/></radialGradient>
    <radialGradient id="rO" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f0a14a" stop-opacity="0.85"/><stop offset="100%" stop-color="#f0a14a" stop-opacity="0"/></radialGradient>
    <radialGradient id="rT" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#b39ddb" stop-opacity="0.85"/><stop offset="100%" stop-color="#b39ddb" stop-opacity="0"/></radialGradient>
    <clipPath id="brain"><path d="M150,372 C122,262 212,182 332,190 C380,146 476,150 516,206 C552,176 618,188 642,242 C692,282 686,366 630,398 C672,438 650,506 582,516 C594,560 538,590 484,568 C446,606 356,608 320,560 C232,588 150,548 168,452 C112,432 112,398 150,372 Z"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="90" y="84" fill="#f4f6fa" font-size="42" font-weight="800" letter-spacing="-1">neural_soul.md — the four-lobe mind</text>
  <text x="90" y="122" fill="#8a94a3" font-size="20">One brain, four lobes, one consciousness. The Will decides · the Senses feel · the Memory speaks · the Vision sees.</text>

  <!-- BRAIN -->
  <g transform="translate(20,170)">
    <g clip-path="url(#brain)">
      <rect x="80" y="120" width="640" height="500" fill="#0d1320"/>
      <ellipse cx="250" cy="290" rx="230" ry="200" fill="url(#rF)"/>
      <ellipse cx="520" cy="270" rx="220" ry="190" fill="url(#rP)"/>
      <ellipse cx="560" cy="470" rx="210" ry="180" fill="url(#rO)"/>
      <ellipse cx="300" cy="510" rx="220" ry="170" fill="url(#rT)"/>
      <!-- gyri folds -->
      <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2.6" stroke-linecap="round">
        <path d="M170,260 q34,-26 68,0 t68,0 t68,0 t68,0 t68,0"/>
        <path d="M150,316 q34,-26 68,0 t68,0 t68,0 t68,0 t68,0 t68,0"/>
        <path d="M150,372 q34,-26 68,0 t68,0 t68,0 t68,0 t68,0 t68,0"/>
        <path d="M158,428 q34,-26 68,0 t68,0 t68,0 t68,0 t68,0 t68,0"/>
        <path d="M186,484 q34,-26 68,0 t68,0 t68,0 t68,0 t68,0"/>
      </g>
      <!-- central sulcus (deep groove) + lateral divider -->
      <g stroke="#05070b" stroke-opacity="0.6" stroke-width="4" fill="none" stroke-linecap="round"><path d="M392,180 C374,290 372,360 380,420"/></g>
      <g stroke="#05070b" stroke-opacity="0.4" stroke-width="3" fill="none" stroke-linecap="round"><path d="M150,392 C300,372 470,372 660,392"/></g>
    </g>
    <!-- brainstem + cerebellum nub -->
    <path d="M452,560 C470,600 470,628 452,640 C436,628 436,600 452,560 Z" fill="#2a2140" stroke="#2b3850" stroke-width="2"/>
    <circle cx="540" cy="556" r="30" fill="#1d2433" stroke="#2b3850" stroke-width="2"/>
    <g stroke="#5e6b7e" stroke-opacity="0.5" stroke-width="1.6" fill="none"><path d="M515,548 q12,-8 24,0 t24,0"/><path d="M515,560 q12,-8 24,0 t24,0"/></g>
    <!-- outline -->
    <path d="M150,372 C122,262 212,182 332,190 C380,146 476,150 516,206 C552,176 618,188 642,242 C692,282 686,366 630,398 C672,438 650,506 582,516 C594,560 538,590 484,568 C446,606 356,608 320,560 C232,588 150,548 168,452 C112,432 112,398 150,372 Z" fill="none" stroke="#2b3850" stroke-width="2.5"/>

    <!-- center hub -->
    <circle cx="378" cy="380" r="46" fill="#0a0d14" stroke="#9fe016" stroke-width="1.6"/>
    <text x="378" y="374" text-anchor="middle" fill="#f4f6fa" font-size="17" font-weight="700">ONE</text>
    <text x="378" y="396" text-anchor="middle" fill="#f4f6fa" font-size="17" font-weight="700">MIND</text>

    <!-- region tags inside -->
    <g font-family="ui-monospace,Menlo,monospace" font-weight="700">
      <text x="245" y="285" text-anchor="middle" fill="#0c1404" font-size="20">FRONTAL</text>
      <text x="520" y="270" text-anchor="middle" fill="#06181a" font-size="20">PARIETAL</text>
      <text x="560" y="475" text-anchor="middle" fill="#1c1304" font-size="20">OCCIPITAL</text>
      <text x="300" y="520" text-anchor="middle" fill="#160c22" font-size="20">TEMPORAL</text>
    </g>
  </g>

  <!-- CALLOUTS -->
  <g transform="translate(770,210)">
    <g transform="translate(0,0)">
      <circle cx="14" cy="14" r="9" fill="#9fe016"/>
      <text x="40" y="14" fill="#f4f6fa" font-size="26" font-weight="700">Frontal — the Will</text>
      <text x="40" y="46" fill="#9aa4b2" font-size="18">Planning, reasoning, decisions. Builds, deploys and</text>
      <text x="40" y="72" fill="#9aa4b2" font-size="18">transacts as the owner would — risk doctrine over conviction.</text>
    </g>
    <g transform="translate(0,130)">
      <circle cx="14" cy="14" r="9" fill="#5ed3d8"/>
      <text x="40" y="14" fill="#f4f6fa" font-size="26" font-weight="700">Parietal — the Senses</text>
      <text x="40" y="46" fill="#9aa4b2" font-size="18">Feels state before acting: risk as pain, volatility as heat.</text>
      <text x="40" y="72" fill="#9aa4b2" font-size="18">The agent's wallet, positions and limits are its body.</text>
    </g>
    <g transform="translate(0,260)">
      <circle cx="14" cy="14" r="9" fill="#b39ddb"/>
      <text x="40" y="14" fill="#f4f6fa" font-size="26" font-weight="700">Temporal — Memory &amp; Voice</text>
      <text x="40" y="46" fill="#9aa4b2" font-size="18">Listens, remembers, speaks in the owner's voice. Learning</text>
      <text x="40" y="72" fill="#9aa4b2" font-size="18">compounds; reputation accrues on-chain (ERC-8004).</text>
    </g>
    <g transform="translate(0,390)">
      <circle cx="14" cy="14" r="9" fill="#f0a14a"/>
      <text x="40" y="14" fill="#f4f6fa" font-size="26" font-weight="700">Occipital — the Vision</text>
      <text x="40" y="46" fill="#9aa4b2" font-size="18">Reads intent, quality and market structure at a glance.</text>
      <text x="40" y="72" fill="#9aa4b2" font-size="18">Its iNFT image is its identity — a founder's seal.</text>
    </g>
  </g>

  <!-- bottom band: three modes -->
  <g transform="translate(90,712)">
    <rect x="0" y="0" width="1420" height="150" rx="16" fill="#0e131c" stroke="#1c2433"/>
    <text x="32" y="44" fill="#9fe016" font-size="15" font-family="ui-monospace,Menlo,monospace" font-weight="700">THREE MODES · ONE BOOK · ONE RISK LAW</text>
    <g font-family="'Helvetica Neue',Arial,sans-serif">
      <rect x="32" y="62" width="318" height="64" rx="10" fill="#11161f" stroke="#26303f"/>
      <text x="52" y="92" fill="#e6eaf0" font-size="20" font-weight="700">Assistant</text><text x="52" y="114" fill="#8a94a3" font-size="15">answer · code · analyze · execute</text>
      <rect x="370" y="62" width="318" height="64" rx="10" fill="#11161f" stroke="#26303f"/>
      <text x="390" y="92" fill="#e6eaf0" font-size="20" font-weight="700">Macro</text><text x="390" y="114" fill="#8a94a3" font-size="15">regime · liquidity · the bias</text>
      <rect x="708" y="62" width="318" height="64" rx="10" fill="#11161f" stroke="#26303f"/>
      <text x="728" y="92" fill="#e6eaf0" font-size="20" font-weight="700">Systematic</text><text x="728" y="114" fill="#8a94a3" font-size="15">timing · sizing · stops · exits</text>
      <text x="1052" y="86" fill="#5f6b7a" font-size="30">→</text>
      <rect x="1086" y="62" width="304" height="64" rx="10" fill="#0f150f" stroke="#33421f"/>
      <text x="1106" y="92" fill="#bdf24a" font-size="20" font-weight="700">ONE BOOK</text><text x="1106" y="114" fill="#8a94a3" font-size="15">unified risk doctrine</text>
    </g>
  </g>
</svg></body></html>
