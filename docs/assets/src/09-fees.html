<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}svg{display:block}</style></head><body>
<svg width="1600" height="560" viewBox="0 0 1600 560" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b0d14"/><stop offset="100%" stop-color="#06070b"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#11151e"/><stop offset="100%" stop-color="#0c0f16"/></linearGradient>
  </defs>
  <rect width="1600" height="560" fill="url(#bg)"/>
  <text x="90" y="84" fill="#f4f6fa" font-size="42" font-weight="800" letter-spacing="-1">Marketplace economics</text>
  <text x="90" y="122" fill="#8a94a3" font-size="20">A platform fee on sales — <tspan fill="#cdd6e0">not</tspan> a publisher reward. Access is open to everyone; you only pay when something sells.</text>

  <!-- iNFT -->
  <g transform="translate(90,170)">
    <rect width="460" height="240" rx="18" fill="url(#card)" stroke="#33421f"/>
    <rect x="0" y="0" width="460" height="5" rx="2.5" fill="#9fe016"/>
    <text x="32" y="62" fill="#e6eaf0" font-size="26" font-weight="700">iNFT agents</text>
    <text x="32" y="132" fill="#bdf24a" font-size="62" font-weight="800" font-family="ui-monospace,Menlo,monospace">5%</text>
    <text x="32" y="172" fill="#cdd6e0" font-size="19">on <tspan font-weight="700">every sale, forever</tspan></text>
    <text x="32" y="200" fill="#8a94a3" font-size="16" font-family="ui-monospace,Menlo,monospace">primary + every resale</text>
    <text x="32" y="224" fill="#8a94a3" font-size="16" font-family="ui-monospace,Menlo,monospace">embedded in the contract</text>
  </g>

  <!-- Skills -->
  <g transform="translate(570,170)">
    <rect width="460" height="240" rx="18" fill="url(#card)" stroke="#1c2433"/>
    <rect x="0" y="0" width="460" height="5" rx="2.5" fill="#5ed3d8"/>
    <text x="32" y="62" fill="#e6eaf0" font-size="26" font-weight="700">Skills</text>
    <text x="32" y="132" fill="#5ed3d8" font-size="62" font-weight="800" font-family="ui-monospace,Menlo,monospace">1%</text>
    <text x="32" y="172" fill="#cdd6e0" font-size="19">only on the <tspan font-weight="700">first sale</tspan></text>
    <text x="32" y="200" fill="#8a94a3" font-size="16" font-family="ui-monospace,Menlo,monospace">bought once, then</text>
    <text x="32" y="224" fill="#8a94a3" font-size="16" font-family="ui-monospace,Menlo,monospace">deployed onto any clone</text>
  </g>

  <!-- Tools -->
  <g transform="translate(1050,170)">
    <rect width="460" height="240" rx="18" fill="url(#card)" stroke="#1c2433"/>
    <rect x="0" y="0" width="460" height="5" rx="2.5" fill="#b39ddb"/>
    <text x="32" y="62" fill="#e6eaf0" font-size="26" font-weight="700">Tools</text>
    <text x="32" y="132" fill="#b39ddb" font-size="62" font-weight="800" font-family="ui-monospace,Menlo,monospace">Free</text>
    <text x="32" y="172" fill="#cdd6e0" font-size="19">free to use</text>
    <text x="32" y="200" fill="#8a94a3" font-size="16" font-family="ui-monospace,Menlo,monospace">the 5% applies only when</text>
    <text x="32" y="224" fill="#8a94a3" font-size="16" font-family="ui-monospace,Menlo,monospace">a tool is minted as an iNFT</text>
  </g>

  <!-- currency rail -->
  <g transform="translate(90,448)">
    <rect width="1420" height="64" rx="12" fill="#0e131c" stroke="#1c2433"/>
    <text x="28" y="30" fill="#9fe016" font-size="13" font-family="ui-monospace,Menlo,monospace" font-weight="700">TWO RAILS</text>
    <text x="28" y="52" fill="#cdd6e0" font-size="17">Agent NFTs trade in <tspan fill="#fff" font-weight="700">ETH / USDC on Base</tspan> · Skills &amp; platform services run on the <tspan fill="#bdf24a" font-weight="700">$ICLONE token</tspan> (price fixed in USD, quantity adjusts).</text>
  </g>
</svg></body></html>
