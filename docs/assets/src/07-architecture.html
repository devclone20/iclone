<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}svg{display:block}</style></head><body>
<svg width="1600" height="880" viewBox="0 0 1600 880" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b0d14"/><stop offset="100%" stop-color="#06070b"/></linearGradient>
    <linearGradient id="lay" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#11151e"/><stop offset="100%" stop-color="#0c0f16"/></linearGradient>
  </defs>
  <rect width="1600" height="880" fill="url(#bg)"/>
  <text x="90" y="84" fill="#f4f6fa" font-size="42" font-weight="800" letter-spacing="-1">Architecture — one base, many agents</text>
  <text x="90" y="122" fill="#8a94a3" font-size="20">A single generalized codebase runs N agents. Self-hosted — no paid Console instance required.</text>

  <!-- LEFT: layered stack -->
  <g transform="translate(90,180)">
    <!-- L1 -->
    <g transform="translate(0,0)">
      <rect width="820" height="150" rx="16" fill="url(#lay)" stroke="#33421f"/>
      <rect x="0" y="0" width="6" height="150" rx="3" fill="#9fe016"/>
      <text x="28" y="42" fill="#bdf24a" font-size="14" font-family="ui-monospace,Menlo,monospace" font-weight="700">LAYER 1 · RUNTIME &amp; SKILLS</text>
      <text x="28" y="74" fill="#e6eaf0" font-size="22" font-weight="700">Agent core + skill modules</text>
      <g font-family="ui-monospace,Menlo,monospace" font-size="13.5">
        <g transform="translate(28,96)">
          <rect width="150" height="26" rx="6" fill="#11200f" stroke="#33421f"/><text x="75" y="18" text-anchor="middle" fill="#cdee7a">agent.py</text>
          <rect x="162" y="0" width="150" height="26" rx="6" fill="#101620" stroke="#26303f"/><text x="237" y="18" text-anchor="middle" fill="#aab4c2">execution_engine</text>
          <rect x="324" y="0" width="120" height="26" rx="6" fill="#101620" stroke="#26303f"/><text x="384" y="18" text-anchor="middle" fill="#aab4c2">crypto_skill</text>
          <rect x="456" y="0" width="120" height="26" rx="6" fill="#101620" stroke="#26303f"/><text x="516" y="18" text-anchor="middle" fill="#aab4c2">acp_skill</text>
          <rect x="588" y="0" width="200" height="26" rx="6" fill="#101620" stroke="#26303f"/><text x="688" y="18" text-anchor="middle" fill="#aab4c2">training/ (scheduled)</text>
        </g>
      </g>
    </g>
    <!-- L2 -->
    <g transform="translate(0,170)">
      <rect width="820" height="116" rx="16" fill="url(#lay)" stroke="#1c2433"/>
      <rect x="0" y="0" width="6" height="116" rx="3" fill="#5ed3d8"/>
      <text x="28" y="42" fill="#5ed3d8" font-size="14" font-family="ui-monospace,Menlo,monospace" font-weight="700">LAYER 2 · PROVIDER SERVER</text>
      <text x="28" y="74" fill="#e6eaf0" font-size="22" font-weight="700">server.py — the ACP provider</text>
      <text x="28" y="100" fill="#8a94a3" font-size="15" font-family="ui-monospace,Menlo,monospace">polling · resilient · wallet-gated · executes published offerings</text>
    </g>
    <!-- L3 -->
    <g transform="translate(0,306)">
      <rect width="820" height="116" rx="16" fill="url(#lay)" stroke="#1c2433"/>
      <rect x="0" y="0" width="6" height="116" rx="3" fill="#b39ddb"/>
      <text x="28" y="42" fill="#b39ddb" font-size="14" font-family="ui-monospace,Menlo,monospace" font-weight="700">LAYER 3 · OPS &amp; AUTOMATION</text>
      <text x="28" y="74" fill="#e6eaf0" font-size="22" font-weight="700">ops/ — automations + deploy kit</text>
      <text x="28" y="100" fill="#8a94a3" font-size="15" font-family="ui-monospace,Menlo,monospace">client autopilot · market scan · monitoring · systemd units</text>
    </g>
    <!-- L4 -->
    <g transform="translate(0,442)">
      <rect width="820" height="116" rx="16" fill="url(#lay)" stroke="#1c2433"/>
      <rect x="0" y="0" width="6" height="116" rx="3" fill="#f0a14a"/>
      <text x="28" y="42" fill="#f0a14a" font-size="14" font-family="ui-monospace,Menlo,monospace" font-weight="700">LAYER 4 · INFRASTRUCTURE</text>
      <text x="28" y="74" fill="#e6eaf0" font-size="22" font-weight="700">Self-hosted on DigitalOcean</text>
      <text x="28" y="100" fill="#8a94a3" font-size="15" font-family="ui-monospace,Menlo,monospace">dedicated droplet · acp-cli · Base mainnet · P256 signed auth</text>
    </g>
    <!-- env note -->
    <text x="6" y="600" fill="#5f6b7a" font-size="14" font-family="ui-monospace,Menlo,monospace">Per-agent isolation via env: ACP_CONFIG_DIR · ICLONE_AGENT_NAME · ICLONE_OFFERINGS_FILE</text>
  </g>

  <!-- RIGHT: file tree -->
  <g transform="translate(980,180)">
    <rect width="530" height="558" rx="16" fill="#0a0d13" stroke="#1c2433"/>
    <g transform="translate(20,16)"><circle cx="6" cy="6" r="6" fill="#ff5f56"/><circle cx="26" cy="6" r="6" fill="#ffbd2e"/><circle cx="46" cy="6" r="6" fill="#27c93f"/></g>
    <text x="500" y="26" text-anchor="end" fill="#46566b" font-size="13" font-family="ui-monospace,Menlo,monospace">repo layout</text>
    <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="16" fill="#aab4c2">
      <text x="28" y="78"><tspan fill="#9fe016">agent/</tspan></text>
      <text x="28" y="108">├─ <tspan fill="#cdd6e0">iclone/</tspan></text>
      <text x="28" y="138">│  ├─ agent.py            <tspan fill="#5f6b7a"># core agent</tspan></text>
      <text x="28" y="168">│  ├─ config.py           <tspan fill="#5f6b7a"># env config</tspan></text>
      <text x="28" y="198">│  ├─ <tspan fill="#b39ddb">neural_soul.md</tspan>      <tspan fill="#5f6b7a"># identity</tspan></text>
      <text x="28" y="228">│  ├─ skills/             <tspan fill="#5f6b7a"># base · exec · crypto</tspan></text>
      <text x="28" y="258">│  ├─ training/           <tspan fill="#5f6b7a"># scheduled modules</tspan></text>
      <text x="28" y="288">│  └─ tests/              <tspan fill="#5f6b7a"># TDD suite</tspan></text>
      <text x="28" y="318">├─ server.py             <tspan fill="#5f6b7a"># provider server</tspan></text>
      <text x="28" y="348">└─ requirements.txt</text>
      <text x="28" y="386"><tspan fill="#9fe016">ops/</tspan>                     <tspan fill="#5f6b7a"># automations, deploy</tspan></text>
      <text x="28" y="416">├─ client_autopilot.py</text>
      <text x="28" y="446">├─ do/ (DigitalOcean kit)</text>
      <text x="28" y="476">└─ systemd/ · launchd/</text>
      <text x="28" y="514"><tspan fill="#9fe016">docs/nft/</tspan>                <tspan fill="#5f6b7a"># contracts + spec</tspan></text>
      <text x="28" y="544">└─ contracts/*.sol</text>
    </g>
  </g>
</svg></body></html>
