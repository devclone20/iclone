<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="limeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fe016" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9fe016" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="400" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="397" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="392" width="1100" height="4" fill="url(#limeline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g stroke="#9fe016" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5"/>
  </g>
  <circle cx="111" cy="10" r="1.6" fill="#9fe016"/>
  <circle cx="106.8" cy="22" r="1.7" fill="#9fe016"/>
  <circle cx="115.2" cy="22" r="1.7" fill="#9fe016"/>
  <path d="M107 27 Q111 30 115 27" stroke="#9fe016" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">what iCLONE is — four pillars, one agent</text>

  <g font-size="12">
    <rect x="40" y="90" width="245" height="210" rx="10" fill="#161b22" stroke="#9fe016" stroke-width="2"/>
    <text x="62" y="126" fill="#9fe016" font-weight="bold" font-size="15">AUTONOMOUS</text>
    <rect x="62" y="138" width="36" height="3" rx="1.5" fill="#9fe016"/>
    <text x="62" y="172" fill="#c9d1d9">operates independently</text>
    <text x="62" y="194" fill="#8b949e">across many domains at once</text>
    <text x="62" y="216" fill="#566070">tasks · agents · commerce</text>

    <rect x="298" y="90" width="245" height="210" rx="10" fill="#161b22" stroke="#6ea8ff" stroke-width="2"/>
    <text x="320" y="126" fill="#6ea8ff" font-weight="bold" font-size="15">OWNABLE</text>
    <rect x="320" y="138" width="36" height="3" rx="1.5" fill="#6ea8ff"/>
    <text x="320" y="172" fill="#c9d1d9">the NFT is the agent key</text>
    <text x="320" y="194" fill="#8b949e">ownerOf() controls it</text>
    <text x="320" y="216" fill="#566070">trade it like any token</text>

    <rect x="556" y="90" width="245" height="210" rx="10" fill="#161b22" stroke="#b39ddb" stroke-width="2"/>
    <text x="578" y="126" fill="#b39ddb" font-weight="bold" font-size="15">CONFIGURABLE</text>
    <rect x="578" y="138" width="36" height="3" rx="1.5" fill="#b39ddb"/>
    <text x="578" y="172" fill="#c9d1d9">neural_soul.md base memory</text>
    <text x="578" y="194" fill="#8b949e">+ owner configuration</text>
    <text x="578" y="216" fill="#566070">+ purchasable skills</text>

    <rect x="814" y="90" width="245" height="210" rx="10" fill="#161b22" stroke="#f0a14a" stroke-width="2"/>
    <text x="836" y="126" fill="#f0a14a" font-weight="bold" font-size="15">ECONOMIC</text>
    <rect x="836" y="138" width="36" height="3" rx="1.5" fill="#f0a14a"/>
    <text x="836" y="172" fill="#c9d1d9">works and earns on ACP</text>
    <text x="836" y="194" fill="#8b949e">its own on-chain wallet</text>
    <text x="836" y="216" fill="#566070">settles jobs in crypto</text>
  </g>

  <text x="550" y="352" text-anchor="middle" fill="#8b949e" font-size="13">own it like a token · run it like software · it works like an employee</text>
