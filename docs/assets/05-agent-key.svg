      <stop offset="0" stop-color="#c48b96" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c48b96" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="440" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="437" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="432" width="1100" height="4" fill="url(#limeline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g stroke="#c48b96" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5"/>
  </g>
  <circle cx="111" cy="10" r="1.6" fill="#c48b96"/>
  <circle cx="106.8" cy="22" r="1.7" fill="#c48b96"/>
  <circle cx="115.2" cy="22" r="1.7" fill="#c48b96"/>
  <path d="M107 27 Q111 30 115 27" stroke="#c48b96" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">minting — two halves fused into one agent key</text>

  <!-- sources -->
  <g font-size="12">
    <rect x="40" y="80" width="300" height="110" rx="10" fill="#161b22" stroke="#c48b96" stroke-width="2"/>
    <text x="60" y="108" fill="#c48b96" font-weight="bold">IMAGE</text>
    <text x="60" y="132" fill="#c9d1d9">deterministic silhouette</text>
    <text x="60" y="152" fill="#8b949e">stored fully on-chain</text>
    <text x="60" y="172" fill="#566070" font-size="11">as an SVG data URI</text>

    <rect x="40" y="230" width="300" height="110" rx="10" fill="#161b22" stroke="#b39ddb" stroke-width="2"/>
    <text x="60" y="258" fill="#b39ddb" font-weight="bold">NEURAL SOUL</text>
    <text x="60" y="282" fill="#c9d1d9">neural_soul.md</text>
    <text x="60" y="302" fill="#8b949e">base character, shown pre-sale</text>
    <text x="60" y="322" fill="#566070" font-size="11">sealed on Irys / Arweave</text>
  </g>

  <g stroke="#566070" stroke-width="2.5" fill="none">
    <path d="M340 135 424 192"/>
    <path d="M416 190 426 194 419 202" />
    <path d="M340 285 424 228"/>
    <path d="M419 218 426 226 416 230"/>
  </g>

  <!-- merge -->
  <rect x="434" y="155" width="240" height="110" rx="10" fill="#161b22" stroke="#f0a14a" stroke-width="2.5"/>
  <text x="554" y="188" text-anchor="middle" fill="#f0a14a" font-weight="bold" font-size="15">MINT</text>
  <text x="554" y="212" text-anchor="middle" fill="#c9d1d9" font-size="12">tokenURI = merge of both</text>
  <text x="554" y="234" text-anchor="middle" fill="#566070" font-size="11">{ image · soul · attributes }</text>

  <path d="M674 210 750 210" stroke="#566070" stroke-width="2.5"/>
  <path d="M743 204 752 210 743 216" fill="none" stroke="#566070" stroke-width="2.5"/>

  <!-- token -->
  <rect x="760" y="155" width="300" height="110" rx="10" fill="#161b22" stroke="#6ea8ff" stroke-width="2.5"/>
  <text x="780" y="188" fill="#6ea8ff" font-weight="bold" font-size="15">ERC-721 TOKEN</text>
  <text x="780" y="212" fill="#c9d1d9" font-size="12">the agent key</text>
  <text x="780" y="234" fill="#8b949e" font-size="12">ownerOf() → controls the agent</text>

  <text x="550" y="398" text-anchor="middle" fill="#8b949e" font-size="13">not an NFT with a picture — a key: transfer it and the whole agent goes with it</text>
