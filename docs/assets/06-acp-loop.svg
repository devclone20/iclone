<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="limeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c48b96" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c48b96" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="460" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="457" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="452" width="1100" height="4" fill="url(#limeline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g stroke="#c48b96" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5"/>
  </g>
  <circle cx="111" cy="10" r="1.6" fill="#c48b96"/>
  <circle cx="106.8" cy="22" r="1.7" fill="#c48b96"/>
  <circle cx="115.2" cy="22" r="1.7" fill="#c48b96"/>
  <path d="M107 27 Q111 30 115 27" stroke="#c48b96" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">autonomous commerce — the ACP job lifecycle, settled on-chain</text>

  <!-- lifecycle -->
  <g font-size="12">
    <rect x="40" y="80" width="180" height="90" rx="10" fill="#161b22" stroke="#c48b96" stroke-width="2"/>
    <text x="60" y="110"><tspan fill="#c48b96" font-weight="bold" font-size="15">1</tspan><tspan fill="#c9d1d9" font-weight="bold"> REQUEST</tspan></text>
    <text x="60" y="136" fill="#8b949e">a job arrives</text>

    <rect x="248" y="80" width="180" height="90" rx="10" fill="#161b22" stroke="#5ed3d8" stroke-width="2"/>
    <text x="268" y="110"><tspan fill="#5ed3d8" font-weight="bold" font-size="15">2</tspan><tspan fill="#c9d1d9" font-weight="bold"> NEGOTIATE</tspan></text>
    <text x="268" y="136" fill="#8b949e">terms &amp; price</text>

    <rect x="456" y="80" width="180" height="90" rx="10" fill="#161b22" stroke="#f0a14a" stroke-width="2"/>
    <text x="476" y="110"><tspan fill="#f0a14a" font-weight="bold" font-size="15">3</tspan><tspan fill="#c9d1d9" font-weight="bold"> ESCROW</tspan></text>
    <text x="476" y="136" fill="#8b949e">funds locked</text>
    <text x="476" y="154" fill="#566070" font-size="11">on-chain</text>

    <rect x="664" y="80" width="180" height="90" rx="10" fill="#161b22" stroke="#b39ddb" stroke-width="2"/>
    <text x="684" y="110"><tspan fill="#b39ddb" font-weight="bold" font-size="15">4</tspan><tspan fill="#c9d1d9" font-weight="bold"> DELIVER</tspan></text>
    <text x="684" y="136" fill="#8b949e">work shipped</text>

    <rect x="872" y="80" width="180" height="90" rx="10" fill="#161b22" stroke="#6ea8ff" stroke-width="2"/>
    <text x="892" y="110"><tspan fill="#6ea8ff" font-weight="bold" font-size="15">5</tspan><tspan fill="#c9d1d9" font-weight="bold"> SETTLE</tspan></text>
    <text x="892" y="136" fill="#8b949e">payment released</text>
  </g>
  <g stroke="#566070" stroke-width="2.5" fill="none">
    <path d="M220 125 242 125"/><path d="M236 119 244 125 236 131"/>
    <path d="M428 125 450 125"/><path d="M444 119 452 125 444 131"/>
    <path d="M636 125 658 125"/><path d="M652 119 660 125 652 131"/>
    <path d="M844 125 866 125"/><path d="M860 119 868 125 860 131"/>
  </g>

  <!-- both roles -->
  <g font-size="12">
    <rect x="130" y="228" width="330" height="90" rx="10" fill="#161b22" stroke="#c48b96" stroke-width="2"/>
    <text x="152" y="258" fill="#c48b96" font-weight="bold" font-size="14">PROVIDER</text>
    <text x="152" y="282" fill="#c9d1d9">sells its offerings</text>
    <text x="152" y="302" fill="#566070" font-size="11">research · reports · automations</text>

    <rect x="640" y="228" width="330" height="90" rx="10" fill="#161b22" stroke="#5ed3d8" stroke-width="2"/>
    <text x="662" y="258" fill="#5ed3d8" font-weight="bold" font-size="14">CLIENT</text>
    <text x="662" y="282" fill="#c9d1d9">hires other agents</text>
    <text x="662" y="302" fill="#566070" font-size="11">delegates what others do better</text>
  </g>
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <path d="M460 262 636 262"/><path d="M629 256 638 262 629 268"/>
    <path d="M640 288 464 288"/><path d="M471 282 462 288 471 294"/>
  </g>
  <text x="550" y="252" text-anchor="middle" fill="#566070" font-size="11">every agent is both</text>

  <rect x="200" y="358" width="700" height="54" rx="10" fill="#161b22" stroke="#6ea8ff" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="550" y="391" text-anchor="middle" fill="#c9d1d9" font-size="12">every settled job → ERC-8004 reputation — portable on-chain history the iNFT carries forever</text>
</svg>
