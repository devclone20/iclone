<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="limeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c48b96" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c48b96" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="540" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="537" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="532" width="1100" height="4" fill="url(#limeline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <g stroke="#c48b96" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5"/>
  </g>
  <circle cx="111" cy="10" r="1.6" fill="#c48b96"/>
  <circle cx="106.8" cy="22" r="1.7" fill="#c48b96"/>
  <circle cx="115.2" cy="22" r="1.7" fill="#c48b96"/>
  <path d="M107 27 Q111 30 115 27" stroke="#c48b96" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">the four-lobe mind — one consciousness · three modes · one book</text>

  <!-- lobes -->
  <g font-size="12">
    <rect x="40" y="72" width="245" height="160" rx="10" fill="#161b22" stroke="#c48b96" stroke-width="2"/>
    <text x="62" y="102" fill="#c48b96" font-weight="bold" font-size="15">FRONTAL</text>
    <text x="62" y="122" fill="#8b949e" font-size="11">THE WILL</text>
    <text x="62" y="154" fill="#c9d1d9">identity · decisions</text>
    <text x="62" y="176" fill="#8b949e">planning · self-control</text>
    <text x="62" y="198" fill="#566070">it is the one that acts</text>

    <rect x="298" y="72" width="245" height="160" rx="10" fill="#161b22" stroke="#6ea8ff" stroke-width="2"/>
    <text x="320" y="102" fill="#6ea8ff" font-weight="bold" font-size="15">PARIETAL</text>
    <text x="320" y="122" fill="#8b949e" font-size="11">THE SENSES</text>
    <text x="320" y="154" fill="#c9d1d9">risk felt as pain</text>
    <text x="320" y="176" fill="#8b949e">volatility as temperature</text>
    <text x="320" y="198" fill="#566070">the wallet is its body</text>

    <rect x="556" y="72" width="245" height="160" rx="10" fill="#161b22" stroke="#b39ddb" stroke-width="2"/>
    <text x="578" y="102" fill="#b39ddb" font-weight="bold" font-size="15">TEMPORAL</text>
    <text x="578" y="122" fill="#8b949e" font-size="11">MEMORY &amp; VOICE</text>
    <text x="578" y="154" fill="#c9d1d9">language · communication</text>
    <text x="578" y="176" fill="#8b949e">compounding memory</text>
    <text x="578" y="198" fill="#566070">reputation &amp; bonds</text>

    <rect x="814" y="72" width="245" height="160" rx="10" fill="#161b22" stroke="#5ed3d8" stroke-width="2"/>
    <text x="836" y="102" fill="#5ed3d8" font-weight="bold" font-size="15">OCCIPITAL</text>
    <text x="836" y="122" fill="#8b949e" font-size="11">THE VISION</text>
    <text x="836" y="154" fill="#c9d1d9">patterns · trends · movement</text>
    <text x="836" y="176" fill="#8b949e">and its own iNFT face —</text>
    <text x="836" y="198" fill="#566070">the image IS its identity</text>
  </g>

  <!-- connectome -->
  <rect x="40" y="262" width="1019" height="54" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="550" y="295" text-anchor="middle" fill="#c9d1d9" font-size="13">one mind, no conflict — you do not switch between lobes; you are all four, at once, always</text>

  <g stroke="#566070" stroke-width="2">
    <line x1="205" y1="316" x2="205" y2="342"/>
    <line x1="550" y1="316" x2="550" y2="342"/>
    <line x1="894" y1="316" x2="894" y2="342"/>
  </g>

  <!-- modes -->
  <g font-size="12">
    <rect x="40" y="346" width="331" height="112" rx="10" fill="#161b22" stroke="#c48b96" stroke-width="2"/>
    <text x="62" y="378"><tspan fill="#c48b96" font-weight="bold" font-size="14">1 · ASSISTANT</tspan><tspan fill="#566070" font-size="11">  lineage: Hermes</tspan></text>
    <text x="62" y="404" fill="#c9d1d9">answer · build · execute</text>
    <text x="62" y="426" fill="#8b949e">general intelligence, tools in hand</text>

    <rect x="384" y="346" width="331" height="112" rx="10" fill="#161b22" stroke="#f0a14a" stroke-width="2"/>
    <text x="406" y="378"><tspan fill="#f0a14a" font-weight="bold" font-size="14">2 · MACRO</tspan><tspan fill="#566070" font-size="11">  lineage: Druckenmiller</tspan></text>
    <text x="406" y="404" fill="#c9d1d9">18-month view · three lenses</text>
    <text x="406" y="426" fill="#8b949e">liquidity · valuation · technicals</text>

    <rect x="728" y="346" width="331" height="112" rx="10" fill="#161b22" stroke="#6ea8ff" stroke-width="2"/>
    <text x="750" y="378"><tspan fill="#6ea8ff" font-weight="bold" font-size="14">3 · SYSTEMATIC</tspan><tspan fill="#566070" font-size="11">  lineage: Seykota</tspan></text>
    <text x="750" y="404" fill="#c9d1d9">the system decides, not emotion</text>
    <text x="750" y="426" fill="#8b949e">trend scores · trailing stops only</text>
  </g>

  <text x="550" y="502" text-anchor="middle" fill="#8b949e" font-size="13">three modes reconciled into ONE BOOK — a single ledger under a single risk doctrine</text>
</svg>
