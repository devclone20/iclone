name: Training — Day B

on:
  schedule:
    - cron: '0 5 * * 2,4,6'
  workflow_dispatch:
    inputs:
      note:
        description: 'Nota opcional'
        required: false
        default: 'Manual'

jobs:
  train-rider:
    name: Rider (orchestrator test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install anthropic
      - name: Rider orchestration test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'EOF'
import anthropic, json
client = anthropic.Anthropic()
msg = client.messages.create(
    model="claude-sonnet-4-6",
    max_tokens=512,
    messages=[{"role":"user","content":"You are the Rider orchestrator agent. Run a self-diagnostic: confirm you can coordinate Hacker and Engineer agents on a minimal task. Reply with: status=PASS or FAIL and reason."}]
)
print(msg.content[0].text)
EOF
      - name: Report
        if: always()
        run: echo "Rider test — $(date -u '+%Y-%m-%d %H:%M UTC')"

  train-hacker:
