name: Training — Agent Fleet

# One training system for the whole devclone20 agent fleet (9 agents).
# Replaces the legacy Day A / Day B hub workflows and the per-tool-repo
# trainings (removed 2026-08-07).
#
# Design laws:
# - Deterministic core: the curriculum + drills run with zero external API
#   dependency, so a billing problem can never silently kill training again.
# - Optional LLM layer: when ANTHROPIC_API_KEY has credit, the engine adds a
#   coach note; when it does not, the report says so and the run stays green.
# - Every session ends with ONE organized report: committed to
#   training/reports/ AND opened as an issue — GitHub notifies the owner's
#   email on issue creation. The issue is closed immediately after (the email
#   still fires; the tracker stays clean).
# - No droplet access, no ssh, no ACP CLI execution in CI. Training studies
#   the canonical skills and drills on transcripts; live trading stays
#   droplet-only by law.

on:
  schedule:
    - cron: '0 5 * * 1,3,5'   # Mon/Wed/Fri 05:00 UTC — fleet curriculum (9 agents)
    - cron: '0 5 * * 2,4'     # Tue/Thu 05:00 UTC — specialty: doctor-agent (IST) + forense-ai (web)
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note for this session'
        required: false
        default: 'Manual'
      mode:
        description: 'Session kind'
        type: choice
        options: [auto, fleet, specialty]
        default: auto

permissions:
  contents: write
  issues: write

concurrency:
  group: fleet-training
  cancel-in-progress: false

jobs:
  train:
    name: Fleet training session
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4

      # Canonical skill sources (public repo, read-only). The agents study the
      # real, battle-tested skill files — not summaries of summaries.
      - name: Checkout skill sources
        uses: actions/checkout@v4
        with:
          repository: devclone20/cloneframe_app_executable
          path: sources/cloneframe
          sparse-checkout: |
            agent/.pi/skills

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fleet law (owner, 2026-08-07): never install packages published less
      # than 14 days ago. This script resolves the newest PyPI release that
      # has passed the 14-day soak and installs exactly that version.
      - name: Install optional LLM layer (14-day quarantine)
        run: python training/quarantine_pip.py anthropic || true

      - name: Run training session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKILL_SOURCES: sources/cloneframe/agent/.pi/skills
          SESSION_NOTE: ${{ inputs.note || 'Scheduled' }}
          SESSION_MODE: ${{ inputs.mode || 'auto' }}
        run: python training/engine.py

      - name: Commit training outputs
        run: |
          git config user.name 'iclone-training'
          git config user.email 'aigenesisvip20@gmail.com'
          git add training/state training/skills training/reports
          if git diff --cached --quiet; then
            echo 'Nothing new to commit'
          else
            git commit -m "training: fleet session $(date -u '+%Y-%m-%d')"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Email the report (issue -> GitHub notification)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f training/reports/issue_body.md ]; then
            echo 'No report produced — engine failed before writing one.'
            printf 'O motor de treino falhou antes de produzir relatório. Ver logs do run %s.\n' "$GITHUB_RUN_ID" > training/reports/issue_body.md
          fi
          url=$(gh issue create \
            --title "📚 Treino — $(date -u '+%Y-%m-%d') ($(date -u '+%H:%M') UTC)" \
            --body-file training/reports/issue_body.md)
          echo "Report issue: $url"
          gh issue close "$url" --comment 'Relatório entregue por email. Histórico completo em training/reports/.'
